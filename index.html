<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <title>PixelOps Agent Command Center</title>
  <meta name="description" content="Retro pixel-art Tactical Spy Safehouse Mobile Agent Command Center PWA with autonomous pathfinding, modular skills, and local sidecar bridge." />
  <meta name="theme-color" content="#0a0a0c" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PixelOps" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <!-- Preload high-priority tactical operative sprites for immediate zero-latency arm rendering -->
  <link rel="preload" as="image" href="/assets/agents/exo_hacker_stand.png" />
  <link rel="preload" as="image" href="/assets/agents/tactical_tech_ops_stand.png" />
  <link rel="preload" as="image" href="/assets/agents/cipher_stand.png" />
  <link rel="preload" as="image" href="/assets/agents/nyx_stand.png" />
  <link rel="preload" as="image" href="/assets/agents/vance_stand.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Silkscreen:wght@400;700&display=swap"
    rel="stylesheet"
  />
  <!-- Google Identity Services (GIS) Client SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!-- Puter.js 1-Click Zero-Key Multi-Model AI SDK -->
  <script src="https://js.puter.com/v2/"></script>
  <script>
    // Google Identity & OAuth 2.0 popup callback relay
    (function() {
      if (window.opener && (window.location.hash.indexOf('access_token') !== -1 || window.location.search.indexOf('code=') !== -1)) {
        try {
          var params = {};
          if (window.location.hash) {
            new URLSearchParams(window.location.hash.substring(1)).forEach(function(v, k) { params[k] = v; });
          }
          if (window.location.search) {
            new URLSearchParams(window.location.search).forEach(function(v, k) { params[k] = v; });
          }
          window.opener.postMessage({ type: 'GOOGLE_AUTH_SUCCESS', params: params, googleAuthSuccess: true }, '*');
          window.close();
        } catch (e) {
          console.warn('[OAuth] Callback relay failed:', e);
        }
      }
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
